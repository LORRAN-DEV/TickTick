[alembic]
script_location = migrations
# A URL do banco vem de TICKTICK_DATABASE_URL (ver migrations/env.py); a linha abaixo é só o padrão.
sqlalchemy.url = postgresql+psycopg://ticktick:ticktick@127.0.0.1:5432/ticktick

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (pytest com PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ticktick
          POSTGRES_PASSWORD: ticktick
          POSTGRES_DB: ticktick_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ticktick" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Lint e formatação
        run: uv run ruff check . && uv run ruff format --check .
      - name: Testes
        run: uv run pytest
        env:
          TICKTICK_TEST_DATABASE_URL: postgresql+psycopg://ticktick:ticktick@127.0.0.1:5432/ticktick_teste

  docker:
    name: Docker Compose (sobe tudo e confere)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - name: Configuração de teste
        run: |
          printf 'DOMINIO=localhost\nPOSTGRES_SENHA=senhaDoCi123\nPORTA_HTTP=8080\nPORTA_HTTPS=8443\nPASTA_BACKUP=./backups\n' > .env
      - name: Build das imagens
        run: docker compose build
      - name: Subir
        run: docker compose up -d --wait --wait-timeout 180
      - name: Criar usuário
        run: echo "senha-do-ci-12345" | docker compose run --rm -T api ticktick-api criar-usuario ci@exemplo.com --senha-stdin
      - name: Verificar
        run: PORTA_HTTPS=8443 EMAIL=ci@exemplo.com SENHA=senha-do-ci-12345 ./verificar.sh
      - name: Backup gerado
        run: ls backups/ticktick-*.dump
      - name: Logs se falhar
        if: failure()
        run: docker compose logs --tail 100
      - name: Descer
        if: always()
        run: docker compose down -v

  verificar:
    name: Testes, tipos, lint, build e e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres: # para os testes de sync (objetivo 8) com a API de verdade
        image: postgres:16
        env:
          POSTGRES_USER: ticktick
          POSTGRES_PASSWORD: ticktick
          POSTGRES_DB: ticktick_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ticktick" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Dependências da API (para o e2e de sync)
        run: uv sync --locked
        working-directory: apps/api

      - uses: pnpm/action-setup@v4 # versão do pnpm vem de "packageManager" no package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Testes de unidade (core e web)
        run: pnpm test

      - name: Tipos
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Navegador do Playwright
        run: pnpm --filter @ticktick/e2e exec playwright install --with-deps chromium

      - name: Testes de ponta a ponta (com a API e Postgres)
        run: pnpm e2e
        env:
          TICKTICK_E2E_DATABASE_URL: postgresql+psycopg://ticktick:ticktick@127.0.0.1:5432/ticktick_e2e

      - name: Guardar resultados do e2e se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-resultados
          path: tests/test-results/
          retention-days: 7
